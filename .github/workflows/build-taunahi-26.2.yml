name: Build Taunahi mc26.2

on:
  push:
    branches:
      - taunahi-mc26.2-final
  pull_request:
    branches:
      - taunahi-mc26.2-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-taunahi:
    name: Build obfuscated Taument for Minecraft 26.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Zulu JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          add-job-summary-as-pr-comment: never

      - name: Apply Taunahi build patches
        run: python3 scripts/apply-taunahi-ci-patches.py

      - name: Prepare unpacked jars
        run: ./gradlew unpackAllJars

      - name: Build with Gradle and ProGuard
        run: ./gradlew build

      - name: Select and validate production JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Firmament-*-obfuscated.jar' | head -n 1)"
          test -n "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          echo "Production jar: $JAR"
          python3 - "$JAR" <<'PY'
          import json
          import sys
          import zipfile

          jar = sys.argv[1]
          with zipfile.ZipFile(jar) as zf:
              names = set(zf.namelist())
              meta = json.loads(zf.read("fabric.mod.json"))
              print("--- fabric.mod.json ---")
              print(json.dumps(meta, indent=2))
              assert meta.get("id") == "taument", f"unexpected mod id: {meta.get('id')!r}"
              minecraft = meta.get("depends", {}).get("minecraft")
              assert minecraft == ">=26.2", f"unexpected Minecraft dependency: {minecraft!r}"
              assert not any("ModAnnouncer" in name for name in names), "ModAnnouncer is present in production JAR"
              assert "firmament.mixins.json" in names, "firmament.mixins.json missing"
              assert "moe/nea/firmament/mixins/ScreenChangeEventPatch.class" in names, "ScreenChangeEventPatch missing"
              print("Validated: taument, Minecraft >=26.2, no ModAnnouncer, mixin class present")
          PY
          echo "--- SHA-256 ---"
          sha256sum "$JAR"

      - name: Upload Taunahi mc26.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: taument-mc26.2-obfuscated
          path: ${{ env.JAR }}
          if-no-files-found: error

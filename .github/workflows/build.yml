name: Build
on:
    - push
    - pull_request

permissions:
    pull-requests: write

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v5
                name: Checkout repository
                with:
                    fetch-tags: true
                    fetch-depth: 0
            -   uses: ./.github/composite/gradle
            -   name: Build with gradle
                run: |
                    ./gradlew build
            -   name: Restore runtime Mixin refmap and print checksum
                run: |
                    set -euo pipefail
                    rm -f build/libs/*sources*.jar build/libs/*-api.jar

                    # The Taunahi/ProGuard output currently drops the Loom-generated
                    # refmap even though firmament.mixins.json still references it.
                    # Restore the refmap from the matching official 44.3.0 mc26.1.2
                    # release; the mixin sources/targets are the upstream 44.3.0 ones.
                    curl -fL \
                      'https://github.com/FirmamentMC/Firmament/releases/download/44.3.0%2Bmc26.1/Firmament-44.3.0%2Bmc26.1.2.jar' \
                      -o /tmp/firmament-official.jar
                    unzip -p /tmp/firmament-official.jar Firmament-refmap.json > /tmp/Firmament-refmap.json
                    test -s /tmp/Firmament-refmap.json

                    for jar in build/libs/Firmament-*.jar; do
                        zip -j "$jar" /tmp/Firmament-refmap.json
                        unzip -l "$jar" | grep -F 'Firmament-refmap.json'
                    done

                    sha256sum build/libs/*.jar
            -   name: Upload build artifact
                uses: actions/upload-artifact@v4
                with:
                    name: built-mod-jar
                    path: build/libs/Firmament-*.jar

    test:
        name: Test
        needs: build
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
                name: Checkout repository
                with:
                    fetch-tags: true
                    fetch-depth: 0
                    filter: 'tree:0'
            -   uses: ./.github/composite/gradle
            -   name: Build with gradle
                run: |
                    ./gradlew test --scan

    prepare-release:
        name: Prepare a release
        runs-on: ubuntu-22.04
        needs: build
        permissions:
            contents: write
        if: ${{ 'push' == github.event_name && startsWith(github.ref, 'refs/tags/') }}
        steps:
            -   uses: actions/checkout@v5
                name: Checkout repository
                with:
                    fetch-tags: true
                    fetch-depth: 0
                    filter: 'tree:0'
            -   name: Download generated artifact
                uses: actions/download-artifact@v5
                with:
                    name: built-mod-jar
            -   name: Generate changelog
                run: ./docs/generate-changelog.sh > changelog.md
            -   name: Upload release
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    gh release create --draft -t "Firmament ${{ github.ref_name }}" "${{ github.ref_name }}" -F "changelog.md" "*.jar"
